<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeka Parkuru - Oyun Eleme ve Seçim Paneli</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #0B132B; color: #F8FAFC; padding: 20px 16px 140px; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 26px; font-weight: 900; color: #2DD4BF; margin-bottom: 6px; }
    .header p { color: #94A3B8; font-size: 14px; max-width: 650px; margin: 0 auto; line-height: 1.5; }

    /* STICKY BAR */
    .sticky-bar {
      position: sticky; top: 10px; z-index: 100;
      background: rgba(28, 37, 65, 0.95); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px;
      padding: 12px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); margin-bottom: 20px; gap: 12px;
    }
    .counts { display: flex; gap: 16px; font-size: 14px; font-weight: 800; }
    .badge-keep { color: #34D399; background: #064E3B; padding: 6px 14px; border-radius: 99px; }
    .badge-remove { color: #F87171; background: #450A0A; padding: 6px 14px; border-radius: 99px; }
    
    .actions { display: flex; gap: 8px; }
    .btn-act { background: #3A4A7A; color: white; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; transition: 0.2s; }
    .btn-act:hover { background: #4B5E99; }
    .btn-act.highlight { background: #0D9488; color: #CCFBF1; }

    /* CATEGORY TABS */
    .filter-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .tab {
      background: #1C2541; border: 1px solid #3A4A7A; color: #94A3B8;
      padding: 6px 14px; border-radius: 99px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .tab.active { background: #0D9488; color: white; border-color: #2DD4BF; }

    /* GRID */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    /* CARD */
    .card {
      background: #1C2541; border: 2.5px solid #2A385E; border-radius: 18px;
      padding: 14px; display: flex; flex-direction: column; justify-content: space-between;
      transition: all 0.2s ease; position: relative; overflow: hidden;
    }
    .card.status-keep {
      border-color: #10B981;
      background: linear-gradient(180deg, #1C2541 0%, rgba(6, 78, 59, 0.4) 100%);
    }
    .card.status-remove {
      border-color: #EF4444;
      background: linear-gradient(180deg, #1C2541 0%, rgba(69, 10, 10, 0.6) 100%);
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.25);
    }
    .card.recommended::before {
      content: 'ÖNERİLEN ELEME';
      position: absolute; top: 10px; right: 10px; z-index: 10;
      background: #DC2626; color: white; font-size: 9px; font-weight: 900;
      padding: 3px 8px; border-radius: 99px; letter-spacing: 0.5px;
    }

    /* ARTWORK CONTAINER */
    .art-container {
      width: 100%; height: 130px; border-radius: 12px;
      background-color: #0B132B; background-repeat: no-repeat;
      margin-bottom: 12px; position: relative; overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex; align-items: center; justify-content: center;
    }
    .art-container img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .art-fallback {
      font-size: 42px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }

    /* SPRITE STYLES */
    .sprite-sheet {
      background-size: 200% 400%;
      background-position: var(--pos, 0% 0%);
    }
    .sprite-3x3 {
      background-size: 300% 300%;
      background-position: var(--pos, 0% 0%);
    }

    .meta { margin-bottom: 14px; }
    .cat-tag { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 2px; }
    .title { font-size: 17px; font-weight: 900; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { font-size: 11px; color: #94A3B8; margin-top: 1px; }
    .reason { font-size: 11.5px; color: #CBD5E1; margin-top: 6px; line-height: 1.35; min-height: 32px; }

    /* BUTTONS */
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-opt {
      border: none; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 900;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: all 0.15s; background: #2A385E; color: #94A3B8;
    }
    
    .card.status-keep .btn-opt.opt-keep {
      background: #10B981; color: white; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.5);
    }
    .card.status-remove .btn-opt.opt-remove {
      background: #EF4444; color: white; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.6);
    }

    /* BOTTOM BAR */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(11, 19, 43, 0.98); backdrop-filter: blur(16px);
      border-top: 1px solid #3A4A7A; padding: 14px 24px;
      display: flex; justify-content: space-between; align-items: center; z-index: 200; gap: 16px;
    }
    .summary-msg { font-size: 14px; color: #E2E8F0; }
    .btn-finish {
      background: linear-gradient(135deg, #10B981, #059669); color: white; border: none;
      padding: 12px 26px; border-radius: 12px; font-size: 14px; font-weight: 900; cursor: pointer;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }
    .btn-finish:hover { transform: scale(1.02); }
  </style>
</head>

    <h1>🎮 Zeka Parkuru Oyun Eleme Paneli</h1>
    <p>Aşağıdaki tüm oyunların görsellerini inceleyerek kalmasını veya sistemden çıkartılmasını istediğiniz oyunları belirleyebilirsiniz.</p>
  </div>

  <div class="sticky-bar">
    <div class="counts">

    </div>
    <div class="actions">

    </div>

  <div class="filter-tabs" id="tabsContainer">

  <div class="games-grid" id="grid"></div>
</div>

<div class="bottom-bar">

</div>

const state = {};
games.forEach(g => {
  state[g.id] = g.rec ? 'remove' : 'keep';
});

let currentFilter = 'all';

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const filtered = games.filter(g => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'rec') return g.rec;
    return g.cat === currentFilter;
  });

  filtered.forEach(g => {
    const isRem = state[g.id] === 'remove';
    const card = document.createElement('div');
    card.className = `card ${isRem ? 'status-remove' : 'status-keep'} ${g.rec ? 'recommended' : ''}`;
    card.id = `c_${g.id}`;

    let artHtml = '';
    if (g.img) {
      artHtml = `<div class="art-container"><img src="${g.img}" alt="${g.title}" onerror="this.style.display='none';this.parentElement.innerHTML='<div class=\\'art-fallback\\'>🎮</div>';"></div>`;
    } else if (g.sheet) {
      const cls = g.is3x3 ? 'sprite-3x3' : 'sprite-sheet';
      artHtml = `<div class="art-container ${cls}" style="background-image: url('${g.sheet}'); --pos: ${g.pos};"></div>`;
    } else {
      artHtml = `<div class="art-container"><div class="art-fallback">🎮</div></div>`;
    }

    card.innerHTML = `
      <div>
        ${artHtml}
        <div class="meta">
          <div class="cat-tag" style="color: ${g.color};">${g.catName}</div>
          <div class="title" title="${g.title}">${g.title}</div>
          <div class="sub">${g.sub || g.id}</div>
          <div class="reason">${g.desc}</div>
        </div>
      </div>
      <div class="btns">
        <button class="btn-opt opt-keep" onclick="selectGame('${g.id}', 'keep')">✅ KALSIN</button>
        <button class="btn-opt opt-remove" onclick="selectGame('${g.id}', 'remove')">❌ ÇIKAR</button>
      </div>
    `;

    grid.appendChild(card);
  });

  updateCounts();
}

function selectGame(id, val) {
  state[id] = val;
  const card = document.getElementById(`c_${id}`);
  if (card) {
    card.classList.remove('status-keep', 'status-remove');
    card.classList.add(val === 'remove' ? 'status-remove' : 'status-keep');
  }
  updateCounts();
}

function setAll(val) {
  games.forEach(g => state[g.id] = val);
  render();
}

function setRecommended() {
  games.forEach(g => state[g.id] = g.rec ? 'remove' : 'keep');
  render();
}

function applyFilter(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function updateCounts() {
  let k = 0, r = 0;
  const remList = [];
  games.forEach(g => {
    if (state[g.id] === 'remove') {
      r++;
      remList.push(g.title);
    } else {
      k++;
    }
  });

  document.getElementById('keepCount').innerText = k;
  document.getElementById('removeCount').innerText = r;
  document.getElementById('summary').innerHTML = `Toplam <strong>${r} oyun çıkarılmak</strong>, <strong>${k} oyun tutulmak</strong> üzere seçildi.`;
}

function copyResult() {
  const remGames = games.filter(g => state[g.id] === 'remove');
  const keepGames = games.filter(g => state[g.id] === 'keep');

  const text = `Oyun seçimlerimi tamamladım:\n\n` +
    `❌ ÇIKARILACAK OYUNLAR (${remGames.length} adet):\n` +
    remGames.map((g, i) => `${i + 1}. ${g.title} (${g.id})`).join('\n') +
    `\n\n✅ SİSTEMDE KALACAK OYUNLAR (${keepGames.length} adet):\n` +
    keepGames.map((g, i) => `${i + 1}. ${g.title}`).join(', ') +
    `\n\nBu seçime göre sistemi güncelle lütfen.`;

  navigator.clipboard.writeText(text).then(() => {
    alert(`🎉 Seçimleriniz panoya kopyalandı! (${remGames.length} oyun çıkarılacak)\nŞimdi sohbete yapıştırabilirsiniz.`);
  }).catch(() => {
    prompt("Seçimleriniz kopyalamaya hazır:", text);
  });
}

// Başlat
render();
</script>

</body>
</html>
