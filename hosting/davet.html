<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Zekâ Parkuru • Düello Daveti</title>
  <style>
    body{margin:0;background:#07162e;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;min-height:100vh;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:520px;width:100%;background:#10274b;border:1px solid #ffffff22;border-radius:24px;padding:28px;box-sizing:border-box;text-align:center}
    h1{margin:0 0 12px;font-size:26px}p{color:#ffffffc7;line-height:1.55}.btn{display:block;background:#ff4fa3;color:#07162e;text-decoration:none;font-weight:900;border-radius:16px;padding:15px 18px;margin-top:18px}.small{font-size:13px;color:#ffffff88;margin-top:18px}
  </style>
</head>
<body>
<main>
  <h1>⚔️ Zekâ Parkuru Düellosu</h1>
  <p>Bir oyuncu seni Zekâ Parkuru'nda düelloya davet etti.</p>
  <a id="open" class="btn" href="#">UYGULAMADA AÇ</a>
  <p class="small">Uygulama kurulu değilse Zekâ Parkuru'nu Google Play üzerinden yükleyip bu bağlantıyı yeniden aç.</p>
</main>
<script>
  const id=new URLSearchParams(location.search).get('c')||'';
  const safe=/^[A-Za-z0-9_-]{1,160}$/.test(id)?id:'';
  const link=safe?'zekaparkuru://challenge?id='+encodeURIComponent(safe):'';
  const button=document.getElementById('open');
  if(link){button.href=link;}else{button.textContent='DAVET BAĞLANTISI GEÇERSİZ';button.removeAttribute('href');}
</script>
</body>
</html>
